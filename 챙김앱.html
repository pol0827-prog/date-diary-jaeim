<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9603b">
<title>챙김 — 날짜·학원비·장보기·가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f1;--card:#fff;--ink:#2b211c;--mute:#7a6a60;--line:#eadfd5;--acc:#d9603b;--acc-ink:#fff;--soft:#fbe3d9;--ok:#2f7d57;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1512;--card:#261d19;--ink:#f3e9e2;--mute:#b2a094;--line:#3a2d26;--acc:#ef7a55;--acc-ink:#1b1512;--soft:#43271d;--ok:#6fcf9b;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1512;--card:#261d19;--ink:#f3e9e2;--mute:#b2a094;--line:#3a2d26;--acc:#ef7a55;--acc-ink:#1b1512;--soft:#43271d;--ok:#6fcf9b;--bad:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 96px}
h1{font-size:30px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.f{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.f .w{grid-column:1/-1}
label{font-size:13px;color:var(--mute);display:block;margin:0 0 2px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button.x{border:0;background:none;color:var(--mute);padding:6px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--line);color:var(--ink);white-space:nowrap}
.badge.hot{background:var(--acc);color:var(--acc-ink)}
.badge.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.badge.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.t{font-weight:700}.m{color:var(--mute);font-size:13px}
.alert{background:var(--soft);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.err{color:var(--bad);font-size:14px;margin:6px 0 0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:16px}
.bar{height:8px;border-radius:4px;background:var(--acc);margin-top:4px}
.chk{width:26px;height:26px;border-radius:8px;padding:0;flex:none;line-height:1}
.chk[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.done{text-decoration:line-through;color:var(--mute)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 2px;font-size:14px;border-radius:10px}
nav button[aria-current="true"]{color:var(--acc);font-weight:700;background:var(--soft)}
a.cal{color:var(--acc);font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var KEY='chaenggim-v1';
var S={dates:[],tuition:[],paid:{},groceries:[],ledger:[]};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var won=function(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var ymOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var T0=function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
var days=function(a,b){return Math.round((a-b)/864e5)};
var tab='dates',ym=ymOf(new Date()),err='',rc=null,SAMPLE=null,IMGOK=false;
var CATS=['식비','교육','교통','생활','의료','문화','기타'];

/* 음력 → 양력 */
var LF=null;try{LF=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric'});}catch(e){}
function lp(d){var p=LF.formatToParts(d);return[p.find(function(x){return x.type==='month'}).value,+p.find(function(x){return x.type==='day'}).value]}
var lc={};
function lunarToSolar(y,m,d){
  if(!LF)return null;var k=y+'-'+m+'-'+d;if(lc[k]!==undefined)return lc[k];
  var start=null,i,x,r;
  for(i=0;i<60;i++){x=new Date(y,0,15+i);r=lp(x);if(r[0]==='1'&&r[1]===1){start=x;break}}
  var res=null;
  if(start){for(var t=0;t<2;t++){var dd=d-t;if(t&&d!==30)break;
    for(i=0;i<390;i++){x=new Date(y,start.getMonth(),start.getDate()+i);r=lp(x);if(r[0]===String(m)&&r[1]===dd){res=x;break}}
    if(res)break}}
  lc[k]=res;return res}
function nextDate(it){
  var t=T0();
  if(it.type==='약속')return it.cal==='lunar'?lunarToSolar(it.y,it.m,it.d):new Date(it.y,it.m-1,it.d);
  for(var y=t.getFullYear();y<=t.getFullYear()+1;y++){
    var s=it.cal==='lunar'?lunarToSolar(y,it.m,it.d):new Date(y,it.m-1,it.d);
    if(s&&s>=t)return s}
  return null}
function dBadge(n){
  if(n<0)return'<span class="badge">지남</span>';
  if(n===0)return'<span class="badge hot">오늘</span>';
  return'<span class="badge'+(n<=3?' hot':'')+'">D-'+n+'</span>'}
function gcal(it,s){
  var e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1);
  var f=function(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())};
  var u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.name+' ('+it.type+')')+'&dates='+f(s)+'/'+f(e);
  if(it.type!=='약속'&&it.cal==='solar')u+='&recur='+encodeURIComponent('RRULE:YEARLY');
  return u}

/* 화면 */
function vDates(){
  var t=T0();
  var L=S.dates.map(function(it){var s=nextDate(it);return{it:it,s:s,n:s?days(s,t):9999}});
  L.sort(function(a,b){var ap=a.n<0,bp=b.n<0;return ap===bp?a.n-b.n:(ap?1:-1)});
  var soon=L.filter(function(x){return x.n>=0&&x.n<=3});
  var h='<h1>챙김</h1><p class="sub">소중한 날, 놓치지 않게</p>';
  if(soon.length)h+='<div class="alert"><b>곧 챙길 날</b><br>'+soon.map(function(x){return esc(x.it.name)+' '+(x.n===0?'오늘':x.n+'일 전')}).join(', ')+'</div>';
  h+='<div class="card"><div class="f">'+
  '<div class="w"><label for="dn">이름</label><input id="dn" placeholder="예: 엄마 생신"></div>'+
  '<div><label for="dt">종류</label><select id="dt"><option>생일</option><option>기념일</option><option>약속</option></select></div>'+
  '<div><label for="dc">달력</label><select id="dc"><option value="solar">양력</option><option value="lunar">음력</option></select></div>'+
  '<div><label for="dm">월</label><input id="dm" type="number" min="1" max="12" inputmode="numeric"></div>'+
  '<div><label for="dd">일</label><input id="dd" type="number" min="1" max="31" inputmode="numeric"></div>'+
  '<div class="w"><label for="dy">연도 (약속일 때만)</label><input id="dy" type="number" inputmode="numeric" placeholder="'+t.getFullYear()+'"></div>'+
  '</div><div class="row" style="margin-top:10px"><button class="p" data-act="addDate">추가하기</button><span class="m">생일·기념일은 매년 반복돼요.</span></div>'+(err&&tab==='dates'?'<p class="err">'+err+'</p>':'')+'</div>';
  h+='<h2>다가오는 날</h2>';
  if(!L.length)h+='<p class="m">아직 등록된 날이 없어요. 위에서 첫 날짜를 추가해 보세요.</p>';
  L.forEach(function(x){var it=x.it;
    h+='<div class="card row"><div class="grow"><div class="t">'+esc(it.name)+'</div><div class="m">'+it.type+' · '+(it.cal==='lunar'?'음력':'양력')+' '+it.m+'월 '+it.d+'일'+(x.s?' → '+ymd(x.s):' (날짜를 찾지 못했어요)')+'</div>'+
    (x.s?'<a class="cal" target="_blank" rel="noopener" href="'+gcal(it,x.s)+'">구글 캘린더에 넣기</a>':'')+'</div>'+
    (x.s?dBadge(x.n):'')+'<button class="x" data-act="delDate" data-id="'+it.id+'" aria-label="삭제">삭제</button></div>'});
  if(L.length)h+='<p class="m">D-3, D-2, 당일에 색이 진하게 표시돼요. 휴대폰 알림은 캘린더 앱의 기본 알림 설정을 따라요.</p>';
  return h}

function vTuition(){
  var t=T0(),cur=ymOf(t),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  var tot=0,unpaid=0;
  S.tuition.forEach(function(a){tot+=a.amt;if(!S.paid[a.id+':'+cur])unpaid+=a.amt});
  var h='<h1>학원비</h1><p class="sub">'+(t.getMonth()+1)+'월 납부 현황</p>';
  h+='<div class="sum"><div><span class="m">이번 달 합계</span><b>'+won(tot)+'</b></div><div><span class="m">낼 돈</span><b class="'+(unpaid?'neg':'pos')+'">'+won(unpaid)+'</b></div><div><span class="m">학원 수</span><b>'+S.tuition.length+'곳</b></div></div>';
  h+='<div class="card"><div class="f"><div class="w"><label for="tn">학원 이름 (아이 이름)</label><input id="tn" placeholder="예: 영어학원 (민준)"></div><div><label for="ta">월 금액(원)</label><input id="ta" type="number" inputmode="numeric"></div><div><label for="td">매월 납부일</label><input id="td" type="number" min="1" max="31" inputmode="numeric"></div></div>'+
  '<div style="margin-top:10px"><button class="p" data-act="addTu">추가하기</button></div>'+(err&&tab==='tuition'?'<p class="err">'+err+'</p>':'')+'</div>';
  if(!S.tuition.length)h+='<p class="m">등록된 학원이 없어요. 위에서 추가하면 납부일까지 남은 날을 보여줘요.</p>';
  S.tuition.forEach(function(a){
    var paid=!!S.paid[a.id+':'+cur],due=new Date(t.getFullYear(),t.getMonth(),Math.min(a.day,dim)),n=days(due,t);
    var b=paid?'<span class="badge ok">납부 완료</span>':(n<0?'<span class="badge bad">'+(-n)+'일 지남</span>':dBadge(n));
    h+='<div class="card row"><div class="grow"><div class="t">'+esc(a.name)+'</div><div class="m">'+won(a.amt)+' · 매월 '+a.day+'일</div></div>'+b+
    '<button data-act="payTu" data-id="'+a.id+'">'+(paid?'취소':'납부')+'</button><button class="x" data-act="delTu" data-id="'+a.id+'" aria-label="삭제">삭제</button></div>'});
  if(S.tuition.length)h+='<p class="m">납부를 누르면 가계부에 교육비로 자동 기록돼요.</p>';
  return h}

function vGro(){
  var sel=S.groceries.filter(function(g){return g.done}),sum=sel.reduce(function(s,g){return s+(g.price||0)},0);
  var h='<h1>장보기</h1><p class="sub">살 것을 적고, 산 것은 체크해요</p>';
  h+='<div class="card"><div class="f"><div class="w"><label for="gn">품목</label><input id="gn" placeholder="예: 우유 2개"></div><div class="w"><label for="gp">가격(원, 선택)</label><input id="gp" type="number" inputmode="numeric"></div></div><div style="margin-top:10px"><button class="p" data-act="addGr">추가하기</button></div>'+(err&&tab==='gro'?'<p class="err">'+err+'</p>':'')+'</div>';
  if(!S.groceries.length)h+='<p class="m">목록이 비어 있어요. 사야 할 품목을 추가해 보세요.</p>';
  S.groceries.forEach(function(g){
    h+='<div class="card row"><button class="chk" data-act="togGr" data-id="'+g.id+'" aria-pressed="'+!!g.done+'" aria-label="산 것 체크">'+(g.done?'✓':'')+'</button><div class="grow'+(g.done?' done':'')+'">'+esc(g.name)+'</div><span class="m">'+(g.price?won(g.price):'')+'</span><button class="x" data-act="delGr" data-id="'+g.id+'" aria-label="삭제">삭제</button></div>'});
  if(sel.length)h+='<div class="alert">산 것 '+sel.length+'개 · '+won(sum)+'<div style="margin-top:8px"><button class="p" data-act="grToLedger">가계부에 식비로 기록</button></div></div>';
  return h}

/* 영수증 읽기 */
(async function(){try{if(window.claude){SAMPLE=await claude.use('sample');if(SAMPLE){var l=await SAMPLE.limits().catch(function(){return null});IMGOK=!!(l&&l.images)}}}catch(e){}if(tab==='ledger'&&!rc)render()})();
function shrink(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);
  im.onload=function(){var k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej({own:1,message:'사진을 처리하지 못했어요.'})},'image/jpeg',.85)};
  im.onerror=function(){rej({own:1,message:'이 사진 형식은 읽을 수 없어요. JPG나 PNG로 다시 시도해 주세요.'})};im.src=u})}
async function readReceipt(file){
  rc={s:'busy'};err='';render();
  try{
    var blob=await shrink(file);
    var q='이 이미지는 한국 영수증 사진입니다. 아래 형식의 JSON만 출력하세요(설명과 코드블록 금지). {"date":"결제일 YYYY-MM-DD, 모르면 빈 문자열","store":"상호명","total":"결제 합계 금액, 숫자만, 원 단위","cat":"식비|교육|교통|생활|의료|문화|기타 중 하나","items":"주요 품목 최대 3개를 쉼표로 구분"} 영수증이 아니거나 읽을 수 없으면 {"error":"사유"}만 출력하세요.';
    var r=await SAMPLE.json(q,{images:blob,modelTier:'default'});
    if(!r||r.error)throw{own:1,message:'영수증을 읽지 못했어요. 밝은 곳에서 글자가 선명하게 다시 찍어 주세요.'};
    var memo=((r.store||'')+(r.items?' ('+r.items+')':'')).trim();
    rc={s:'done',d:{date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:ymd(T0()),memo:memo,cat:CATS.indexOf(r.cat)>=0?r.cat:'기타',amt:Math.round(Number(String(r.total).replace(/[^\d.]/g,'')))||0}};
  }catch(e){
    var m=e&&e.own?e.message:(e&&e.code==='not_granted'?'영수증 읽기를 허용하지 않으셨어요. 아래에서 직접 기록해 주세요.':(e&&e.code==='rate_limited'?'요청이 많아요. 잠시 뒤에 다시 시도해 주세요.':'영수증을 읽지 못했어요. 잠시 뒤에 다시 시도하거나 직접 기록해 주세요.'));
    rc={s:'err',m:m}}
  render()}
function vRc(){
  if(!IMGOK)return'';
  var h='<div class="card"><div class="t">영수증으로 기록</div><p class="m" style="margin:2px 0 10px">사진을 올리면 날짜·금액·분류를 읽어 와요. 확인하고 기록하면 가계부에 들어가요.</p>';
  if(rc&&rc.s==='busy')return h+'<p role="status">영수증을 읽는 중이에요. 잠시만 기다려 주세요…</p></div>';
  if(rc&&rc.s==='done'){var d=rc.d;
    h+='<div class="f"><div><label for="rd">날짜</label><input id="rd" type="date" value="'+d.date+'"></div><div><label for="ra">금액(원)</label><input id="ra" type="number" inputmode="numeric" value="'+d.amt+'"></div><div><label for="rk">분류</label><select id="rk">'+CATS.map(function(c){return'<option'+(c===d.cat?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div><div><label for="rm">메모</label><input id="rm" value="'+esc(d.memo)+'"></div></div>'+
    '<div class="row" style="margin-top:10px"><button class="p" data-act="rcSave">이대로 기록하기</button><button data-act="rcCancel">취소</button></div>'+(err?'<p class="err">'+err+'</p>':'')+'<p class="m">읽은 내용이 맞는지 확인해 주세요.</p></div>';
    return h}
  if(rc&&rc.s==='err')h+='<p class="err">'+rc.m+'</p>';
  return h+'<button class="p" data-act="pick">영수증 사진 올리기</button><input id="rf" type="file" accept="image/*" hidden></div>'}

function vLedger(){
  var L=S.ledger.filter(function(e){return e.date.slice(0,7)===ym}).sort(function(a,b){return a.date<b.date?1:-1});
  var inc=0,out=0,by={};
  L.forEach(function(e){if(e.type==='in')inc+=e.amt;else{out+=e.amt;by[e.cat]=(by[e.cat]||0)+e.amt}});
  var mx=Math.max.apply(null,Object.keys(by).map(function(k){return by[k]}).concat([1]));
  var h='<h1>가계부</h1><div class="row" style="margin:0 0 12px"><button data-act="prev" aria-label="이전 달">‹</button><b class="grow" style="text-align:center">'+ym.replace('-','년 ')+'월</b><button data-act="next" aria-label="다음 달">›</button></div>';
  h+='<div class="sum"><div><span class="m">수입</span><b class="pos">'+won(inc)+'</b></div><div><span class="m">지출</span><b class="neg">'+won(out)+'</b></div><div><span class="m">남은 돈</span><b>'+won(inc-out)+'</b></div></div>';
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(ks.length){h+='<div class="card">';ks.forEach(function(k){h+='<div class="row"><span class="grow">'+k+'</span><span>'+won(by[k])+'</span></div><div class="bar" style="width:'+Math.round(by[k]/mx*100)+'%"></div>'});h+='</div>'}
  h+=vRc();
  h+='<div class="card"><div class="f"><div><label for="lt">구분</label><select id="lt"><option value="out">지출</option><option value="in">수입</option></select></div><div><label for="ld">날짜</label><input id="ld" type="date" value="'+ymd(T0())+'"></div><div><label for="lc">분류</label><select id="lc">'+CATS.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select></div><div><label for="la">금액(원)</label><input id="la" type="number" inputmode="numeric"></div><div class="w"><label for="lm">메모</label><input id="lm" placeholder="예: 마트"></div></div><div style="margin-top:10px"><button class="p" data-act="addLe">기록하기</button></div>'+(err&&tab==='ledger'&&!(rc&&rc.s==='done')?'<p class="err">'+err+'</p>':'')+'</div>';
  if(!L.length)h+='<p class="m">이 달에 기록이 없어요.</p>';
  L.forEach(function(e){h+='<div class="card row"><div class="grow"><div class="t">'+esc(e.memo||e.cat)+'</div><div class="m">'+e.date.slice(5).replace('-','/')+' · '+(e.type==='in'?'수입':e.cat)+'</div></div><b class="'+(e.type==='in'?'pos':'neg')+'">'+(e.type==='in'?'+':'-')+won(e.amt)+'</b><button class="x" data-act="delLe" data-id="'+e.id+'" aria-label="삭제">삭제</button></div>'});
  return h}

var TABS=[['dates','챙길 날'],['tuition','학원비'],['gro','장보기'],['ledger','가계부']];
function render(){
  $('#app').innerHTML={dates:vDates,tuition:vTuition,gro:vGro,ledger:vLedger}[tab]();
  $('#nav').innerHTML=TABS.map(function(x){return'<button data-act="tab" data-t="'+x[0]+'" aria-current="'+(tab===x[0])+'">'+x[1]+'</button>'}).join('')}
var v=function(id){return ($('#'+id)||{}).value||''};
function fail(m){err=m;render()}
function ok(){err='';save();render()}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='tab'){tab=b.dataset.t;err='';return render()}
  if(a==='pick'){var fi=$('#rf');if(fi)fi.click();return}
  if(a==='rcCancel'){rc=null;err='';return render()}
  if(a==='rcSave'){
    var ra=Math.round(+v('ra')),rdt=v('rd')||ymd(T0());
    rc.d={date:rdt,memo:v('rm'),cat:v('rk'),amt:ra||0};
    if(!(ra>0)){err='금액을 입력해 주세요.';return render()}
    S.ledger.push({id:uid(),date:rdt,cat:v('rk'),memo:v('rm').trim(),amt:ra,type:'out'});
    ym=rdt.slice(0,7);rc=null;return ok()}
  if(a==='addDate'){
    var n=v('dn').trim(),m=+v('dm'),d=+v('dd'),y=+v('dy'),ty=v('dt'),c=v('dc');
    if(!n)return fail('이름을 입력해 주세요.');
    if(!(m>=1&&m<=12))return fail('월은 1~12 사이로 입력해 주세요.');
    if(!(d>=1&&d<=(c==='lunar'?30:31)))return fail('일을 올바르게 입력해 주세요.');
    if(ty==='약속'&&!y)return fail('약속은 연도도 입력해 주세요.');
    S.dates.push({id:uid(),name:n,type:ty,cal:c,m:m,d:d,y:y||0});return ok()}
  if(a==='delDate'){S.dates=S.dates.filter(function(x){return x.id!==id});return ok()}
  if(a==='addTu'){
    var tn=v('tn').trim(),ta=+v('ta'),td=+v('td');
    if(!tn)return fail('학원 이름을 입력해 주세요.');
    if(!(ta>0))return fail('월 금액을 입력해 주세요.');
    if(!(td>=1&&td<=31))return fail('납부일은 1~31 사이로 입력해 주세요.');
    S.tuition.push({id:uid(),name:tn,amt:ta,day:td});return ok()}
  if(a==='delTu'){S.tuition=S.tuition.filter(function(x){return x.id!==id});return ok()}
  if(a==='payTu'){
    var cur=ymOf(T0()),key=id+':'+cur,ac=S.tuition.find(function(x){return x.id===id});
    if(S.paid[key]){delete S.paid[key];S.ledger=S.ledger.filter(function(e){return e.ref!==key})}
    else{S.paid[key]=1;S.ledger.push({id:uid(),ref:key,date:ymd(T0()),cat:'교육',memo:ac.name+' 학원비',amt:ac.amt,type:'out'})}
    return ok()}
  if(a==='addGr'){
    var gn=v('gn').trim();if(!gn)return fail('품목을 입력해 주세요.');
    S.groceries.push({id:uid(),name:gn,price:+v('gp')||0,done:false});return ok()}
  if(a==='togGr'){var g=S.groceries.find(function(x){return x.id===id});g.done=!g.done;return ok()}
  if(a==='delGr'){S.groceries=S.groceries.filter(function(x){return x.id!==id});return ok()}
  if(a==='grToLedger'){
    var sel=S.groceries.filter(function(g){return g.done}),sum=sel.reduce(function(s,g){return s+(g.price||0)},0);
    if(!sum)return fail('산 것에 가격이 없어요. 가격을 넣어 다시 추가하거나 가계부에서 직접 기록해 주세요.');
    S.ledger.push({id:uid(),date:ymd(T0()),cat:'식비',memo:'장보기: '+sel.map(function(g){return g.name}).join(', '),amt:sum,type:'out'});
    S.groceries=S.groceries.filter(function(g){return !g.done});tab='ledger';ym=ymOf(T0());return ok()}
  if(a==='addLe'){
    var la=+v('la'),ld=v('ld');
    if(!(la>0))return fail('금액을 입력해 주세요.');
    if(!ld)return fail('날짜를 선택해 주세요.');
    S.ledger.push({id:uid(),date:ld,cat:v('lc'),memo:v('lm').trim(),amt:la,type:v('lt')});ym=ld.slice(0,7);return ok()}
  if(a==='delLe'){S.ledger=S.ledger.filter(function(x){return x.id!==id});return ok()}
  if(a==='prev'||a==='next'){var p=ym.split('-'),dt=new Date(+p[0],+p[1]-1+(a==='next'?1:-1),1);ym=ymOf(dt);render()}
});
document.addEventListener('change',function(ev){var t=ev.target;if(t&&t.id==='rf'&&t.files&&t.files[0]&&SAMPLE)readReceipt(t.files[0])});
render();
</script>
</body>
</html>
